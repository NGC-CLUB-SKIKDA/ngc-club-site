<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - New Generation Club</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
    .dashboard-container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .feedback-item { background: #f9f9f9; border-left: 4px solid #3498db; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    .feedback-time { font-size: 0.85rem; color: #7f8c8d; margin-top: 5px; }
    #authMessage { text-align: center; font-size: 1.2rem; color: #e74c3c; margin-top: 50px; }
  </style>
</head>
<body>

  <!-- Protected Dashboard Container -->
  <div id="adminDashboard" class="dashboard-container" style="display: none;">
    <h2>Club Feedback & Submissions Dashboard</h2>
    <p>Logged in as: <span id="userEmailDisplay"></span></p>
    
    <div style="margin-top: 20px;">
      <a href="index.html" style="text-decoration: none; background: #3498db; color: white; padding: 8px 15px; border-radius: 4px;">&larr; Back to Home</a>
      <button id="logoutBtn" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; float: right;">Log Out</button>
    </div>

    <h3 style="margin-top: 40px;">Recent Feedback Messages:</h3>
    <div id="feedbackList">
      <p>Loading feedback...</p>
    </div>
  </div>

  <!-- Access Denied / Login Prompt -->
  <div id="authMessage">
    <h2>Access Restricted</h2>
    <p>Please log in with the official club administrator email to view this dashboard.</p>
    <a href="index.html" style="text-decoration: none; background: #2c3e50; color: white; padding: 10px 20px; border-radius: 4px; display: inline-block; margin-top: 15px;">Go to Home to Sign In</a>
  </div>

  <!-- Firebase App & Firestore Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Include your main script where Firebase is initialized -->
  <script src="script.js"></script>

  <script>
    // Specific script to check login and render feedback on admin.html
    firebase.auth().onAuthStateChanged((user) => {
      const adminEmail = "new.generation.club.21@gmail.com"; // Your club email
      
      if (user && user.email === adminEmail) {
        // Show dashboard, hide restriction notice
        document.getElementById('adminDashboard').style.display = 'block';
        document.getElementById('authMessage').style.display = 'none';
        document.getElementById('userEmailDisplay').textContent = user.email;
        
        // Load feedback from Firestore
        loadAdminFeedback();
      } else {
        // Hide dashboard, show restriction notice
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('authMessage').style.display = 'block';
      }
    });

    async function loadAdminFeedback() {
      const container = document.getElementById('feedbackList');
      container.innerHTML = '';

      try {
        const snapshot = await db.collection('feedback').orderBy('createdAt', 'desc').get();
        
        if (snapshot.empty) {
          container.innerHTML = '<p>No feedback submissions found yet.</p>';
          return;
        }

        snapshot.forEach((doc) => {
          const data = doc.data();
          const dateStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString() : 'Just now';
          
          const div = document.createElement('div');
          div.className = 'feedback-item';
          div.innerHTML = `
            <div><strong>Message:</strong> ${escapeHtml(data.message || '')}</div>
            <div class="feedback-time">Submitted on: ${dateStr}</div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error("Error loading feedback: ", err);
        container.innerHTML = '<p style="color: red;">Error loading feedback data.</p>';
      }
    }

    // Helper to prevent HTML injection
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Logout handling
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        firebase.auth().signOut().then(() => {
          window.location.href = 'index.html';
        });
      });
    }
  </script>
</body>
</html>
